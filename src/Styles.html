<style>
/* Design system from design/G8_Build_Your_Card.html (FIS maroon + gold, Archivo + Inter).
   Fonts fall back to the system stack unless Config web_fonts = TRUE. */
:root{
  --maroon:#6f1d2c;--gold:#e7b64b;--ink:#161213;--muted:#c8bcbe;--line:#3a2e31;--panel:#241d20;--panel2:#2e2528;
  --disp:"Archivo","Barlow Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* card skin — set by the chosen PE Style */
  --ink1:#7d2233;--ink2:#6f1d2c;--ink3:#4a1019;--acc:#e7b64b;--accs:#f3d689;--rib:#3a1008;
  --frame:linear-gradient(145deg,#e0a566,#a15c2b 50%,#7a441f 62%,#d68a4e); /* bronze */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 50% 0%,#2a2024,#120d0e);color:#fff;font-family:var(--body);min-height:100vh;padding:26px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto}
a{color:var(--gold)}
button{font:inherit}

/* loading / toast */
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:80px 0;color:var(--muted);font-size:14px}
.spinner{width:22px;height:22px;border:3px solid #3a2e31;border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#ffd9d9;color:#7a1414}

/* hero */
.hero{text-align:center;margin-bottom:22px}
.hero .k{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--gold)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,52px);margin:6px 0 4px;letter-spacing:-.01em}
.hero p{color:var(--muted);font-size:14px;margin:0}
.who{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 8px}
.av{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#3a2e31;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:22px;color:var(--accs);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who .t{text-align:left}
.who .n{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}
.who .s{font-size:12.5px;color:var(--muted)}

/* two-column layout */
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.step{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.step .saved{font-size:11px;letter-spacing:.04em;color:#7fe0a8;text-transform:none;font-weight:600}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:420px){.styles{grid-template-columns:1fr}}
.sbtn{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;cursor:pointer;transition:.15s;text-align:left;color:#fff;width:100%}
.sbtn:hover{border-color:#5a4a4e;transform:translateY(-1px)}
.sbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sbtn.sel{border-color:var(--acc);background:var(--panel2);box-shadow:0 6px 18px rgba(231,182,75,.2)}
.sbtn[disabled]{opacity:.6;cursor:progress}
.sbtn .se{font-size:24px}.sbtn .sn{font-family:var(--disp);font-weight:700;font-size:16px;margin:5px 0 2px}
.sbtn .sd{font-size:11.5px;color:var(--muted);line-height:1.35}

/* the card */
.cardstage{display:flex;flex-direction:column;align-items:center;gap:14px;position:sticky;top:18px}
.card{width:min(360px,100%);border-radius:24px;padding:4px;background:var(--frame);box-shadow:0 26px 64px rgba(0,0,0,.55),0 0 30px rgba(231,182,75,.35);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-8px) rotate(.4deg)}}
@media(prefers-reduced-motion:reduce){.card,.cinner::after{animation:none}}
.cinner{background:linear-gradient(160deg,var(--ink1),var(--ink2) 42%,var(--ink3));border-radius:20px;padding:17px 19px;position:relative;overflow:hidden;transition:.3s}
.cinner::after{content:"";position:absolute;top:-60%;left:-75%;width:55%;height:220%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.42),transparent);transform:rotate(9deg);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{left:-75%}60%,100%{left:150%}}
.chd{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:700;font-size:11px;color:var(--acc);position:relative;z-index:2}
.ctier{font-family:var(--disp);font-weight:700;font-size:10px;color:var(--rib);background:var(--frame);padding:2px 9px;border-radius:20px}
.cwho{display:flex;align-items:center;gap:10px;margin-top:10px;position:relative;z-index:2}
.cav{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);background:rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--accs);flex:none}
.cav img{width:100%;height:100%;object-fit:cover;display:block}
.cname{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;word-break:break-word}
.cclass{font-size:11px;color:rgba(255,255,255,.72);margin-top:2px}
.crib{background:linear-gradient(90deg,var(--acc),var(--accs));border-radius:9px;padding:6px 13px;font-family:var(--disp);font-weight:700;color:var(--rib);margin:11px 0;display:flex;justify-content:space-between;align-items:center;font-size:18px;position:relative;z-index:2}
.crad{position:relative;z-index:2;margin:2px 0}
.rlabel{font-family:var(--disp);font-size:9px;fill:rgba(255,255,255,.82);font-weight:600}
.rnote{font-family:var(--body);font-size:10px;fill:rgba(255,255,255,.6)}
.cstat{display:flex;gap:7px;margin-top:6px;position:relative;z-index:2}
.cstat div{flex:1;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px;text-align:center}
.cstat b{font-family:var(--disp);font-size:18px;display:block;color:#fff}.cstat span{font-size:8px;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:.05em}
.cbadge{display:flex;gap:9px;justify-content:center;margin-top:11px;position:relative;z-index:2}
.cbadge span{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d6,var(--acc) 62%,#b9871f);display:grid;place-items:center;font-size:15px;opacity:.45;filter:grayscale(.4)}
.cfoot{margin-top:11px;text-align:center;font-family:var(--disp);font-weight:600;font-size:11px;color:var(--acc);position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}
.cardhint{font-size:12px;color:var(--muted);text-align:center;max-width:34ch;line-height:1.45}

/* teaser tiles + what's coming */
.coming{margin-top:44px}
.coming h2{font-family:var(--disp);font-weight:800;font-size:clamp(24px,3.4vw,36px);text-align:center;margin:0 0 6px}
.coming .sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
.crow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:760px){.crow{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.crow{grid-template-columns:1fr}}
.cc{background:#221a1d;border:1px solid var(--line);border-radius:16px;padding:18px}
.cc .ci{font-size:26px}.cc h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:8px 0 4px}.cc p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.glance{margin-top:40px}
.tile{background:#221a1d;border:1px solid var(--line);border-radius:14px;padding:13px 15px 14px;position:relative}
.tile .tnrow{display:flex;align-items:center;gap:6px}.tile .em{font-size:15px}.tile .tn{font-weight:600;font-size:13px}
.tile .tsub{font-size:11px;color:var(--muted);margin:1px 0 10px;min-height:13px}
.track{display:flex;gap:4px}.track i{height:9px;border-radius:3px;flex:1;background:#3a2e31}
.tile .tracklab{font-family:var(--disp);font-size:12px;font-weight:600;margin-top:6px;color:var(--muted)}
.foot{margin-top:28px;border:1px solid var(--line);background:#221a1d;border-radius:14px;padding:14px 18px;font-size:13px;color:var(--muted);display:flex;gap:11px;align-items:center}
.foot b{color:var(--gold)}
.foot .arrow{font-family:var(--disp);font-size:24px;color:var(--gold)}

/* messages for non-student states */
.msg{max-width:520px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 28px;text-align:center}
.msg .big{font-size:38px}
.msg h2{font-family:var(--disp);font-weight:800;font-size:24px;margin:8px 0 6px}
.msg p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
.msg code{background:#120d0e;padding:2px 7px;border-radius:6px;font-size:13px;color:#fff}
.msg .btn{display:inline-block;margin-top:10px;background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;border:none;font-family:var(--disp);font-weight:700;font-size:14px;padding:10px 20px;border-radius:11px;cursor:pointer;text-decoration:none}
.small{font-size:11.5px;color:#9a8f91;text-align:center;margin-top:30px;line-height:1.5}
</style>
