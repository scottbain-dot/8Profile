<script>
(function () {
'use strict';

// ═══════════════ utils ═══════════════
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root) => (root || document).querySelector(sel);
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }

// ═══════════════ server bridge ═══════════════
function rawCall(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) return reject(new Error('Not running inside the Apps Script web app'));
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e && e.message ? e.message : String(e)))) [fn](...args);
  });
}
// Apps Script caps simultaneous runs; a whole class tapping at once produces
// transient "Busy"/timeout errors. Retry those with backoff; permanent ones surface.
const PERMANENT = /Unknown style|not signed in|class list|Not running inside/i;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function call(fn, ...args) {
  let delay = (window.__preview && window.__preview.fastRetry) ? 30 : 1200;
  for (let attempt = 0; ; attempt++) {
    try { return await rawCall(fn, ...args); }
    catch (e) { if (PERMANENT.test(e.message) || attempt >= 4) throw e; await sleep(delay + Math.random() * delay); delay = Math.min(delay * 2, 15000); }
  }
}

const SKINS = {
  competitor: { e: '🏆', d: 'I love to compete and give everything.',          ink: ['#8f2130', '#7a1b28', '#4d0f18'], acc: '#f0c24a', accs: '#ffe08a', rib: '#3a1008' },

  explorer:   { e: '🧭', d: 'I love trying new activities and challenges.',    ink: ['#22508c', '#1d4577', '#0f2747'], acc: '#8fbff0', accs: '#cfe4fb', rib: '#0c2747' },

function hexA(h, a) { h = h.replace('#', ''); return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')'; }
function setSkin(k) {
  const s = SKINS[k] || DEFAULT_SKIN, r = document.documentElement.style;
  r.setProperty('--ink1', s.ink[0]); r.setProperty('--ink2', s.ink[1]); r.setProperty('--ink3', s.ink[2]);

}

// ═══════════════ radar (placeholder shape until Combine data exists — v3) ═══════════════
const AX = ['STAMINA', 'STRENGTH', 'SPEED', 'SKILLS', 'TEAM', 'EFFORT'], PLACE = [.62, .55, .6, .55, .7, .72];
const cx = 150, cy = 90, R = 60;
function pt(i, v) { const a = (-90 + i * 60) * Math.PI / 180; return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)]; }
function radar(skin) {
  let g = '';
  for (let r = 1; r <= 4; r++) { const p = []; for (let i = 0; i < 6; i++) p.push(pt(i, r / 4).join(',')); g += '<polygon points="' + p.join(' ') + '" fill="none" stroke="rgba(255,255,255,.14)"/>'; }
  for (let i = 0; i < 6; i++) { const [x, y] = pt(i, 1.3); const an = Math.abs(x - cx) < 5 ? 'middle' : (x > cx ? 'start' : 'end'); g += '<text x="' + x.toFixed(1) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="' + an + '" class="rlabel">' + AX[i] + '</text>'; }
  g += '<polygon points="' + PLACE.map((v, i) => pt(i, v).map(n => n.toFixed(1)).join(',')).join(' ') + '" fill="' + hexA(skin.acc, .3) + '" stroke="' + skin.accs + '" stroke-width="2.2"/>';
  g += '<text x="150" y="187" text-anchor="middle" class="rnote">your shape fills in at the Combine</text>';
  return '<svg viewBox="0 0 300 190" width="100%" height="160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six-sided fitness and skills chart, placeholder until the Combine">' + g + '</svg>';
}

  'ap-growth':{ e: '🌱', t: 'Growth mindset', m: 'Keep trying; learn from setbacks', what: 'Embrace challenges, try new things, stay positive after setbacks.', when: 'Every lesson, all year.' },
  'ap-team':  { e: '🙌', t: 'Great teammate', m: 'Include, encourage, communicate', what: 'Communicate positively, encourage others, help teammates take part.', when: 'Every lesson, all year.' },
  'ap-manage':{ e: '🧘', t: 'Manage myself & my feelings', m: 'Listen · safe environment · take responsibility', what: 'Manage behaviour and emotions positively without reminders.', when: 'Every lesson, all year.' },
  'rp-know':  { e: '🧠', t: 'Knowledge', m: 'Understanding fitness, health & safety', what: 'Best fit across: fitness concepts (K4), safe practice (K5), health.', when: 'Reported on Canvas, 1–7.' },
  'rp-skill': { e: '🎯', t: 'Skills', m: 'Performing movements & using them in games', what: 'Best fit across: fundamental skills (S1), game skills (S1/S3), planning (S2), team contribution (S4).', when: 'Reported on Canvas, 1–7.' },
  'rp-ct':    { e: '🔄', t: 'Concept transfer', m: 'Using what you know in new sports & situations', what: 'Best fit across: Tactics Cup transfer (C2), meaningful participation (C1), health decisions (C3).', when: 'Reported on Canvas, 1–7.' }

  { k: 'me',      g: 'fit',  e: '💪', t: 'Muscular endurance',       s: 'Muscles that don’t quit. The 20th rep as good as the 1st. · Push-ups · Sit-to-stand' },

const RATING = { strength: { e: '🟢', t: 'Strength' }, neutral: { e: '🟡', t: 'Neutral' }, 'work-on': { e: '🔴', t: 'Work-on' } };
const FREQ = { often: 'Often', sometimes: 'Sometimes', rarely: 'Rarely' };
const CP = 'intro';
let draft = {}; // { cv: { rating, freq }, ... } while rating
function predictionSaved() { return (state.student.predictions || {})[CP] || null; }
function draftDone() { return ITEMS.filter(i => draft[i.k] && draft[i.k].rating && draft[i.k].freq).length; }
function lists(pred) {
  const by = r => ITEMS.filter(i => pred.items[i.k] && pred.items[i.k].rating === r);
  return { strengths: by('strength'), neutral: by('neutral'), workons: by('work-on') };
}

function avatar(st, cls) {

  return '<span class="' + cls + '">' + ini + '</span>';
}
function track(cls, n) { let s = ''; for (let i = 0; i < n; i++) s += '<i></i>'; return '<div class="track">' + s + '</div>'; }
function tile(cls, key, em, name, sub, lab) {

}
function mtile(key, em, name, sub, unit) {
  return '<button type="button" class="tile a-fit" data-ov="' + key + '"><span class="plus">⊕</span><div class="tnrow"><span class="em">' + em + '</span><span class="tn">' + esc(name) + '</span></div><div class="tsub">' + esc(sub) + '</div><div class="measure">—<small>' + esc(unit) + '</small></div></button>';
}
function band(key, em, name) {

}

function lesson1Panel() {

    return '<div class="goals l1"><div class="hd">🔮 Lesson 1 · Predict yourself</div><div class="empty">Before we test anything, what do YOU think? Predict your own strengths &amp; work-ons. We’ll check it against your real results later.</div>' +

  }

function predictView(b) {

function summaryView(b) {

  const list = (arr, empty) => arr.length ? '<ul class="slist">' + arr.map(i => '<li><span class="em">' + i.e + '</span><b>' + esc(i.t) + '</b><span class="sf">' + esc(FREQ[pred.items[i.k].freq]).toLowerCase() + '</span></li>').join('') + '</ul>' : '<p class="empty">' + empty + '</p>';
  return '<div class="wrap">' +
    '<div class="sumhero"><div class="k">LESSON 1 · SAVED ✓</div><h1>Here’s your shape, ' + esc(b.student.first) + '</h1><p>' + L.strengths.length + ' strengths · ' + L.neutral.length + ' neutral · ' + L.workons.length + ' work-ons. Everyone’s shape is different: strong in some parts, growing in others. That’s normal. We’ll check this against your real Combine results, and the interesting part is where you surprise yourself.</p></div>' +
    '<div class="sumgrid"><div class="sumcard g"><h3>🟢 My predicted strengths</h3>' + list(L.strengths, 'You didn’t pick any strengths yet. The Combine might find some for you.') + '</div>' +
    '<div class="sumcard r"><h3>🔴 My work-ons</h3>' + list(L.workons, 'No challenges picked. Bold. The Combine will have a say.') + '</div></div>' +
    '<div class="sumnote">↻ <b>What happens next:</b> the Combine. Same checks in September, January and May, so you can watch yourself get better. Your profile lines this prediction up against your numbers.</div>' +
    '<div class="sumacts"><button type="button" class="ct-btn" id="toprofile">Back to my profile ↗</button><button type="button" class="lnk" id="topredict">Edit my prediction</button></div>' +
  '</div>';
}

// v3 stub: prediction next to Combine measurements. Combine data is null until the
// Combine tab exists; the layout is final so v3 only has to fill the right column.
function compareView(b) {
  const pred = predictionSaved(), combine = b.student.combine || {};
  const rows = ITEMS.map(i => {
    const p = pred && pred.items[i.k], c = combine[i.k];
    return '<div class="crowi a-' + i.g + '"><span class="em">' + i.e + '</span><div class="ct"><b>' + esc(i.t) + '</b><span>' + (p ? RATING[p.rating].e + ' ' + RATING[p.rating].t + ' · ' + esc(FREQ[p.freq]).toLowerCase() : 'no prediction') + '</span></div>' +
      '<div class="cv">' + (c ? esc(String(c)) : '<span class="pending">not yet measured</span>') + '</div></div>';
  }).join('');
  return '<div class="wrap">' +
    '<button type="button" class="back light" id="toprofile">← Back to my profile</button>' +
    '<div class="phero"><div class="k">PREDICTION vs. COMBINE</div><h1>How well did you know yourself?</h1><p>Left: what you predicted in Lesson 1. Right: what the Combine measured. Right now the Combine hasn’t happened, so the right side is waiting.</p></div>' +
    '<div class="chead"><span>Item</span><span>My prediction</span><span>Combine</span></div>' + rows +
    (pred ? '' : '<p class="empty" style="margin-top:14px">You haven’t made a prediction yet. <button type="button" class="lnk" id="topredict">Make it now</button></p>') +
  '</div>';
}

function cardView(b) {
  const st = b.student, styles = b.styles, chosen = st.style;
  const pick = ORDER.filter(k => styles[k]).map(k => {
    const s = SKINS[k];
    return '<button type="button" class="sbtn' + (k === chosen ? ' sel' : '') + '" data-k="' + k + '" aria-pressed="' + (k === chosen) + '"><span class="se">' + s.e + '</span><div class="sn">' + esc(styles[k]) + '</div><div class="sd">' + esc(s.d) + '</div></button>';
  }).join('');
  return '<div class="wrap">' +
    '<button type="button" class="back" id="toprofile">← Back to my profile</button>' +
    '<div class="hero"><div class="k">GRADE 8 PE · ' + esc(b.config.yearLabel) + '</div><h1>Hi ' + esc(st.first) + ', build your Athlete Card</h1><p>Choose your PE Style and make it yours. Your card grows all year.</p></div>' +
    '<div class="grid">' +
      '<div><div class="step">1 · Choose your style <span class="saved" id="saved">' + (chosen ? '✓ saved' : '') + '</span></div><div class="styles" id="styles">' + pick + '</div></div>' +
      '<div class="cardstage"><div class="card" id="card"><div class="cinner">' +
        '<div class="chd"><span>FIS · PE ATHLETE · ' + esc(b.config.yearLabel) + '</span><span class="ctier">BRONZE</span></div>' +
        '<div class="cwho">' + avatar(st, 'cav') + '<div><div class="cname">' + esc(st.name) + '</div>' + (st.klass ? '<div class="cclass">' + esc(st.klass) + '</div>' : '') + '</div></div>' +
        '<div class="crib"><span id="archt">' + (chosen ? esc(styles[chosen]).toUpperCase() : 'PICK A STYLE') + '</span><span id="arche">' + (chosen ? SKINS[chosen].e : '✨') + '</span></div>' +
        '<div class="crad" id="rad">' + radar(SKINS[chosen] || DEFAULT_SKIN) + '</div>' +
        '<div class="cstat"><div><b>—</b><span>Mile</span></div><div><b>—</b><span>Skills</span></div><div><b>—</b><span>Effort</span></div></div>' +
        '<div class="cbadge" aria-label="Badges you can earn"><span>🏃</span><span>📈</span><span>🔥</span><span>⭐</span></div>' +
        '<div class="cfoot">◆ Your card levels up as you grow ◆</div>' +
      '</div></div><div class="cardhint">Your style is your choice. None is "better": it sets your card’s colour and identity.</div></div>' +
    '</div>' +
    '<div class="done"><button type="button" class="ct-btn" id="toprofile2">Done · back to my profile ↗</button></div>' +
  '</div>';
}

function message(big, title, body, extra) {
  return '<div class="msg"><div class="big">' + big + '</div><h2>' + esc(title) + '</h2><p>' + body + '</p>' + (extra || '') + '</div>';
}
function otherView(b) {
  switch (b.role) {
    case 'teacher':
      return message('🧑‍🏫', 'Teacher view', 'You’re signed in as <code>' + esc(b.email) + '</code>, which is on the Teachers tab but not the Students tab. Students who open this link see their own profile.',
        '<p>To see the student view yourself, add your address to the Students tab. Student data lives only in the Sheet.</p>');
    case 'unknown':
      return message('🔎', 'Not on the Grade 8 list yet', 'You’re signed in as <code>' + esc(b.email) + '</code>. That account isn’t on the Grade 8 PE class list.',
        '<p>Tell your PE teacher, or check you opened the link with your FIS account.</p>');
    case 'wrong_domain':
      return message('🔒', 'Use your FIS account', 'This page only works with an FIS Google account.',
        '<p>Sign out of other Google accounts, or open the link in a window where your FIS account is the active one.</p>');
    default:
      return message('🙈', 'Couldn’t confirm who you are', 'Google didn’t tell the page which account is signed in.',
        '<p>Open the link from your FIS account (not incognito). If it keeps happening, tell your PE teacher: the deployment must be "Anyone within FIS".</p>');
  }
}

// ═══════════════ overlay ═══════════════
function openOv(k) {
  let html = '<button class="x" type="button" data-close="1">✕</button>';
  if (k.startsWith('fund-')) {
    const key = k.slice(5), lad = RUBRICS.ladders[key], em = (FUND.find(f => f[0] === key) || ['', '🧩'])[1];
    html += '<h4>' + em + ' ' + esc(lad.name) + '</h4><div class="om">Fundamental skill · 4-level ladder · cleared self → peer → teacher</div>';
    lad.levels.forEach((t, i) => { html += '<div class="lad"><span class="lv">L' + (i + 1) + '</span><span>' + esc(t) + '</span></div>'; });
    html += '<div class="ovfeeds"><b>Not yet tested.</b> Your first level comes from the September Combine, then Jan → May.</div>';
  } else {
    const d = D[k]; if (!d) return;
    html += '<h4>' + d.e + ' ' + esc(d.t) + '</h4><div class="om">' + esc(d.m) + '</div>' +
      '<div class="ovnow"><div class="l">WHAT THIS IS</div><div class="t">' + esc(d.what) + '</div></div>' +
      '<div class="ovnext"><div class="l">↗ WHEN IT FILLS IN</div><div class="t">' + esc(d.when) + '</div></div>';
  }
  $('#ovcard').innerHTML = html; $('#ov').classList.add('show');
}
function closeOv() { $('#ov').classList.remove('show'); }

// ═══════════════ interactions ═══════════════
function applySkin(k) {
  const s = SKINS[k]; if (!s) return;
  setSkin(k);
  $('#archt').textContent = state.styles[k].toUpperCase(); $('#arche').textContent = s.e;
  $('#rad').innerHTML = radar(s);
  document.querySelectorAll('.sbtn').forEach(b => { const on = b.dataset.k === k; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
}
async function choose(k) {
  if (!SKINS[k] || k === state.student.style) { applySkin(k); return; }
  const prev = state.student.style;
  applySkin(k);
  const saved = $('#saved'); saved.textContent = 'saving…';
  document.querySelectorAll('.sbtn').forEach(b => b.disabled = true);
  try {
    const res = await call('saveStyle', k);
    state.student.style = res.style; saved.textContent = '✓ saved';
    toast('Saved. You’re ' + state.styles[k] + '.');
  } catch (e) {
    saved.textContent = prev ? '✓ saved' : '';
    if (prev) applySkin(prev); else { setSkin(''); $('#archt').textContent = 'PICK A STYLE'; $('#arche').textContent = '✨'; $('#rad').innerHTML = radar(DEFAULT_SKIN); document.querySelectorAll('.sbtn').forEach(b => { b.classList.remove('sel'); b.setAttribute('aria-pressed', 'false'); }); }
    toast('Couldn’t save: ' + e.message, true);
  } finally { document.querySelectorAll('.sbtn').forEach(b => b.disabled = false); }
}

function pick(k, field, val) {
  draft[k] = Object.assign({}, draft[k], { [field]: val });
  const item = $('#pi-' + k);
  item.querySelectorAll(field === 'rating' ? '.tl' : '.fq').forEach(b => { const on = b.dataset[field] === val; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const d = draft[k]; item.classList.toggle('done', !!(d.rating && d.freq));
  const n = draftDone(); $('#pdone').textContent = n; $('#pfill').style.width = Math.round(100 * n / ITEMS.length) + '%';
  $('#psave').disabled = n !== ITEMS.length;
  // nudge to the next unrated item on small screens
  if (d.rating && d.freq) { const next = ITEMS.find(i => !(draft[i.k] && draft[i.k].rating && draft[i.k].freq)); if (next && window.innerWidth < 760) { const el = $('#pi-' + next.k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
}
async function savePrediction() {
  const btn = $('#psave'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await call('savePrediction', CP, draft);
    state.student.predictions = Object.assign({}, state.student.predictions, { [CP]: res.prediction });
    show('summary');
  } catch (e) { btn.disabled = false; btn.textContent = 'Save my prediction'; toast('Couldn’t save: ' + e.message, true); }
}
const wire = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('click', fn); };

function show(v) {
  view = v;
  const app = $('#app');
  document.body.classList.toggle('dark', v === 'card');
  setSkin(state.student.style);
  if (v === 'predict') {
    const saved = predictionSaved(); draft = saved ? JSON.parse(JSON.stringify(saved.items)) : {};
    app.innerHTML = predictView(state);
    app.addEventListener('click', e => { const t = e.target.closest('.tl,.fq'); if (!t) return; if (t.dataset.rating) pick(t.dataset.k, 'rating', t.dataset.rating); else pick(t.dataset.k, 'freq', t.dataset.freq); });
    wire('psave', savePrediction); wire('toprofile', () => show('profile'));
  } else if (v === 'summary') {
    app.innerHTML = summaryView(state);
    wire('toprofile', () => show('profile')); wire('topredict', () => show('predict'));
  } else if (v === 'compare') {
    app.innerHTML = compareView(state);
    wire('toprofile', () => show('profile')); wire('topredict', () => show('predict'));
  } else if (v === 'card') {
    app.innerHTML = cardView(state);
    $('#styles').addEventListener('click', e => { const btn = e.target.closest('.sbtn'); if (btn) choose(btn.dataset.k); });
    $('#toprofile').addEventListener('click', () => show('profile'));
    $('#toprofile2').addEventListener('click', () => show('profile'));
  } else {
    app.innerHTML = profileView(state);
    $('#tocard').addEventListener('click', () => show('card'));
    wire('topredict', () => show('predict')); wire('tocompare', () => show('compare'));
    app.addEventListener('click', e => { const t = e.target.closest('[data-ov]'); if (t) openOv(t.dataset.ov); });
  }
  window.scrollTo(0, 0);
}

function render(b) {
  state = b;
  if (b.role !== 'student') { $('#app').innerHTML = otherView(b); return; }
  show(b.student.style ? 'profile' : 'card'); // first visit goes straight to "build your card"
}

$('#ov').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) closeOv(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOv(); });

async function main() {
  try { render(await call('bootstrap')); }
  catch (e) { $('#app').innerHTML = message('⚠️', 'Couldn’t load your profile', esc(e.message), '<p><a class="btn" href="javascript:location.reload()">Try again</a></p>'); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main); else main();
})();
</script>
